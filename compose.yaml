name: vllm-cc-tools-proxy

services:
  vllm-cc-tools-proxy:
    image: node:22-bookworm-slim
    container_name: vllm-cc-tools-proxy
    restart: unless-stopped
    init: true
    working_dir: /workspace/vllm-cc-tools-proxy
    command:
      - /bin/sh
      - -lc
      - |
        set -eu

        SOURCE_DIR="/workspace/vllm-cc-tools-proxy"
        REPOSITORY_URL="https://github.com/ericli1018/vllm-cc-tools-proxy.git"
        REPOSITORY_BRANCH="main"

        if ! command -v git >/dev/null 2>&1 \
          || ! command -v pdfinfo >/dev/null 2>&1 \
          || ! command -v pdftotext >/dev/null 2>&1 \
          || ! command -v pdftoppm >/dev/null 2>&1 \
          || ! command -v convert >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates poppler-utils imagemagick
          rm -rf /var/lib/apt/lists/*
        fi

        mkdir -p "$$SOURCE_DIR"

        if [ ! -d "$$SOURCE_DIR/.git" ]; then
          CLONE_DIR="$$(mktemp -d)"
          trap 'rm -rf "$$CLONE_DIR"' EXIT INT TERM
          git clone --depth 1 --branch main \
            "$$REPOSITORY_URL" \
            "$$CLONE_DIR/repository"
          find "$$SOURCE_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$$CLONE_DIR/repository/." "$$SOURCE_DIR/"
          rm -rf "$$CLONE_DIR"
          trap - EXIT INT TERM
        else
          git -C "$$SOURCE_DIR" checkout "$$REPOSITORY_BRANCH"
          git -C "$$SOURCE_DIR" pull --ff-only origin main
        fi

        cd "$$SOURCE_DIR"

        DEPENDENCY_FINGERPRINT="$$(
          {
            sha256sum package.json
            if [ -f package-lock.json ]; then
              sha256sum package-lock.json
            fi
          } | sha256sum | awk '{print $$1}'
        )"
        DEPENDENCY_STAMP="node_modules/.dependency-fingerprint"
        CURRENT_DEPENDENCY_FINGERPRINT="$$(cat "$$DEPENDENCY_STAMP" 2>/dev/null || true)"

        if [ "$$CURRENT_DEPENDENCY_FINGERPRINT" != "$$DEPENDENCY_FINGERPRINT" ]; then
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi
          mkdir -p node_modules
          printf '%s\n' "$$DEPENDENCY_FINGERPRINT" > "$$DEPENDENCY_STAMP"
        fi

        exec node src/index.js
    ports:
      - "${PROXY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8080
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      VLLM_BASE_MODEL: ${VLLM_BASE_MODEL:-}
      VLLM_BASE_RESPONSE_MODE: ${VLLM_BASE_RESPONSE_MODE:-auto}
      VLLM_BASE_API_KEY: ${VLLM_BASE_API_KEY:-}
      VLLM_BASE_VISION_ENABLED: ${VLLM_BASE_VISION_ENABLED:-false}
      VISION_NATIVE_PASSTHROUGH: ${VISION_NATIVE_PASSTHROUGH:-false}
      VLLM_BASE_CONNECT_TIMEOUT_MS: ${VLLM_BASE_CONNECT_TIMEOUT_MS:-10000}
      VLLM_BASE_HEADERS_TIMEOUT_MS: ${VLLM_BASE_HEADERS_TIMEOUT_MS:-900000}
      VLLM_BASE_BODY_TIMEOUT_MS: ${VLLM_BASE_BODY_TIMEOUT_MS:-900000}
      CONTEXT_COMPACT_PROVIDER: ${CONTEXT_COMPACT_PROVIDER:-vllm}
      CONTEXT_COMPACT_URL: ${CONTEXT_COMPACT_URL:-}
      CONTEXT_COMPACT_MODEL: ${CONTEXT_COMPACT_MODEL:-}
      CONTEXT_COMPACT_API_KEY: ${CONTEXT_COMPACT_API_KEY:-}
      CONTEXT_COMPACT_THINK: ${CONTEXT_COMPACT_THINK:-false}
      VLLM_VISION_URL: ${VLLM_VISION_URL:-}
      VLLM_VISION_MODEL: ${VLLM_VISION_MODEL:-}
      VLLM_VISION_API_KEY: ${VLLM_VISION_API_KEY:-}
      VLLM_VISION_PROVIDER: ${VLLM_VISION_PROVIDER:-vllm}
      VLLM_VISION_THINK: ${VLLM_VISION_THINK:-false}
      VLLM_VISION_TIMEOUT_MS: ${VLLM_VISION_TIMEOUT_MS:-120000}
      SEARXNG_URL: ${SEARXNG_URL:-}
      WEB_FETCH_URL: ${WEB_FETCH_URL:-}
      WEB_FETCH_API_KEY: ${WEB_FETCH_API_KEY:-}
      WEB_FETCH_PROCESSOR_ENABLED: ${WEB_FETCH_PROCESSOR_ENABLED:-true}
      WEB_FETCH_PROCESSOR_PROVIDER: ${WEB_FETCH_PROCESSOR_PROVIDER:-vllm}
      WEB_FETCH_PROCESSOR_URL: ${WEB_FETCH_PROCESSOR_URL:-}
      WEB_FETCH_PROCESSOR_MODEL: ${WEB_FETCH_PROCESSOR_MODEL:-}
      WEB_FETCH_PROCESSOR_API_KEY: ${WEB_FETCH_PROCESSOR_API_KEY:-}
      WEB_FETCH_PROCESSOR_THINK: ${WEB_FETCH_PROCESSOR_THINK:-false}
      WEB_FETCH_PROCESSOR_CONCURRENCY: ${WEB_FETCH_PROCESSOR_CONCURRENCY:-3}
      WEB_FETCH_PROCESSOR_TIMEOUT_MS: ${WEB_FETCH_PROCESSOR_TIMEOUT_MS:-300000}
      LANG_PROCESSOR_ENABLED: ${LANG_PROCESSOR_ENABLED:-false}
      LANG_PROCESSOR_PROVIDER: ${LANG_PROCESSOR_PROVIDER:-vllm}
      LANG_PROCESSOR_URL: ${LANG_PROCESSOR_URL:-}
      LANG_PROCESSOR_MODEL: ${LANG_PROCESSOR_MODEL:-}
      LANG_PROCESSOR_API_KEY: ${LANG_PROCESSOR_API_KEY:-}
      LANG_PROCESSOR_THINK: ${LANG_PROCESSOR_THINK:-false}
      MODEL_RESPONSE_LANGUAGE: ${MODEL_RESPONSE_LANGUAGE:-en-US}
      RESOURCE_PROFILE: ${RESOURCE_PROFILE:-default}
      MANAGED_TASK_TIMEOUT_MS: ${MANAGED_TASK_TIMEOUT_MS:-}
      MANAGED_MODEL_ROUND_TIMEOUT_MS: ${MANAGED_MODEL_ROUND_TIMEOUT_MS:-360000}
      MANAGED_MODEL_STALL_TIMEOUT_MS: ${MANAGED_MODEL_STALL_TIMEOUT_MS:-90000}
      VISION_MAX_CONCURRENCY: ${VISION_MAX_CONCURRENCY:-}
      MEDIA_CACHE_MAX_MB: ${MEDIA_CACHE_MAX_MB:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PROTOCOL_SNIPPETS: ${LOG_PROTOCOL_SNIPPETS:-false}
      DIAGNOSTIC_WEB_TOOL_PASSTHROUGH: ${DIAGNOSTIC_WEB_TOOL_PASSTHROUGH:-false}
      DIAGNOSTIC_WEB_SEARCH_PASSTHROUGH_COUNT: ${DIAGNOSTIC_WEB_SEARCH_PASSTHROUGH_COUNT:-1}
      DIAGNOSTIC_WEB_FETCH_PASSTHROUGH_COUNT: ${DIAGNOSTIC_WEB_FETCH_PASSTHROUGH_COUNT:-1}
      DIAGNOSTIC_WEB_TOOL_TRACE: ${DIAGNOSTIC_WEB_TOOL_TRACE:-false}
      DIAGNOSTIC_WEB_TOOL_TRACE_DIR: ${DIAGNOSTIC_WEB_TOOL_TRACE_DIR:-/var/lib/vllm-cc-tools-proxy/diagnostics/web-tool-trace}
      PROGRESS_VISIBLE_AFTER_MS: ${PROGRESS_VISIBLE_AFTER_MS:-1500}
      PROGRESS_PING_INTERVAL_MS: ${PROGRESS_PING_INTERVAL_MS:-5000}
      PROGRESS_HEARTBEAT_MS: ${PROGRESS_HEARTBEAT_MS:-30000}
      SSE_DRAIN_TIMEOUT_MS: ${SSE_DRAIN_TIMEOUT_MS:-10000}
    volumes:
      - proxy-source:/workspace/vllm-cc-tools-proxy
      - proxy-npm-cache:/root/.npm
      - proxy-apt-cache:/var/cache/apt/archives
      - proxy-data:/var/lib/vllm-cc-tools-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  proxy-source:
  proxy-npm-cache:
  proxy-apt-cache:
  proxy-data:
